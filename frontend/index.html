<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tenda Espírita Vovô Camilo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2 L14 9 L21 9 L15.5 13.2 L17.5 20 L12 15.8 L6.5 20 L8.5 13.2 L3 9 L10 9 Z" stroke="var(--gold)" stroke-width="1.1" stroke-linejoin="round"/></svg>
      <div class="brand-text"><b>Vovô Camilo</b><span>Tenda Espírita</span></div>
    </div>
    <button class="admin-toggle" id="adminToggleBtn">Área do responsável</button>
  </header>

  <main id="main"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="agendar" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Agendar
    </button>
    <button data-tab="minhavez">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
      Minha vez
    </button>
  </nav>

</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
